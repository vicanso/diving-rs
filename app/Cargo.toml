[package]
name = "nsh-app-diving"
version = "0.12.3"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.7.0"
nsh-base = "0.7.0"
env_logger = "0.11"
diving-core = { path = "../crates/diving-core" }
diving-app = { path = "../crates/diving-app" }
bytesize = { version = "2.7.0", features = ["serde"] }
chrono = "0.4.45"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
home = "0.5.12"
log = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.0", default-features = false, features = ["editor", "highlight", "svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.0", default-features = false, features = ["editor", "highlight", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.0", default-features = false, features = ["editor", "highlight", "svg", "net"] }

[dev-dependencies]
nsh-engine = { version = "0.7.0", default-features = false }
nsh-testing = { version = "0.7.0", default-features = false }
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = true
panic = "abort"
