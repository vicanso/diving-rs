[package]
name = "diving-web"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Web server, REST API, MCP server, and webhook runner for diving."
publish = false
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "diving_web"
path = "src/lib.rs"

[[bin]]
name = "diving-web"
path = "src/main.rs"

[dependencies]
diving-app = { workspace = true }
diving-core = { workspace = true }
axum = { workspace = true }
axum-client-ip = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
lru = { workspace = true }
mime = { workspace = true }
mimalloc = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rmcp = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal", "fs", "sync", "time"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tar = { workspace = true }
tempfile = { workspace = true }
