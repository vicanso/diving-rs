[workspace]
resolver = "2"
members = [
    "crates/diving-core",
    "crates/diving-app",
    "crates/diving",
    "crates/diving-web",
]
exclude = ["app"]
default-members = ["crates/diving"]

[workspace.package]
version = "0.12.3"
authors = ["Tree Xie <tree.xie@outlook.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vicanso/diving-rs"
rust-version = "1.100.0"

[workspace.dependencies]
diving-core = { version = "0.12.3", path = "crates/diving-core" }
diving-app = { version = "0.12.3", path = "crates/diving-app" }

axum = "0.8.9"
axum-client-ip = "1.3.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = "1.8.7"
bytes = "1.12.2"
bytesize = { version = "2.7.0", features = ["serde"] }
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
colored = "3.1.1"
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
crossterm = "0.29.0"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
futures = "0.3.34"
glob = "0.3.4"
goblin = { version = "0.10.7", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
hex = "0.4.3"
home = "0.5.12"
http = "1.5.0"
humantime = "2.4.0"
lru = "0.19.0"
mime = "0.3.18"
mimalloc = { version = "0.1.52", default-features = false }
nanoid = "0.5.0"
num_cpus = "1.17.0"
pad = "0.1.6"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17.14"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = { version = "8.14.0", features = ["compression", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
signal-hook = { version = "0.4.6", default-features = false }
signal-hook-registry = "1.4.8"
snafu = "0.9.2"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.54.1", default-features = false }
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
unicode-width = "0.2.3"
unix_mode = "0.1.4"
zstd = { version = "0.14.4", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
