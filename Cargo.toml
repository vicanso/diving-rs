[package]
name = "diving"
version = "0.8.9"
authors = ["Tree Xie <tree.xie@outlook.com>"]
edition = "2021"
keywords = ["diving", "image", "dive"]
license = "Apache-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
axum-client-ip = "1.3.1"
# blake3 hashes file contents for cross-layer duplicate detection (~3 GB/s
# with AVX2, so hash compute is dwarfed by tar decompression).
blake3 = "1.8.5"
bytes = "1.11.1"
bytesize = { version = "2.3.1", features = ["serde"] }
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
# Only YAML is used (~/.diving/config.yml). Disabling default features
# drops the ron/json5/ini/toml parsers and their transitive deps.
config = { version = "0.15.23", default-features = false, features = ["yaml"] }
crossterm = "0.29.0"
# gzip layer decompression. flate2's default (miniz_oxide) is ~2x faster
# than libflate in our measured workloads; pure-Rust, no extra C deps.
flate2 = "1.1.9"
futures = "0.3.32"
glob = "0.3.3"
# ELF parsing for runtime-compatibility checks (DT_NEEDED + glibc version
# requirements of the image's entrypoint binary). Pure Rust, no_std-friendly.
goblin = { version = "0.10.7", default-features = false, features = [
    "elf32",
    "elf64",
    "endian_fd",
    "std",
] }
hex = "0.4.3"
home = "0.5.12"
http = "1.4.1"
humantime = "2.3.0"
lru = "0.18.0"
mime = "0.3.17"
mime_guess = "2.0.5"
# Replaces the system allocator with mimalloc to reduce lock contention and
# fragmentation on the multi-threaded reqwest + tar/zstd decompression hot path.
mimalloc = { version = "0.1.52", default-features = false }
nanoid = "0.5.0"
num_cpus = "1.17.0"
once_cell = "1.21.4"
pad = "0.1.6"
ratatui = "0.30.0"
regex = "1.12.3"
reqwest = { version = "0.13.3", default-features = false, features = [
    # `rustls-no-provider` keeps the platform verifier (system trust store)
    # but skips installing a crypto provider — we install `ring` ourselves
    # in main.rs. The default `rustls` feature pulls in aws-lc-rs which
    # adds ~675 KiB to the release binary.
    "rustls-no-provider",
    "json",
    "stream",
] }
# Direct rustls dep so we can install the `ring` provider as default.
# Pairs with reqwest's `rustls-no-provider` feature above.
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rust-embed = { version = "8.11.0", features = ["compression", "mime-guess"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
signal-hook = { version = "0.4.4", default-features = false }
signal-hook-registry = "1.4.8"
snafu = "0.9.0"
substring = "1.4.5"
# default-features = false drops the xattr feature; we only read tar
# headers (path/mode/size/mtime), never restore xattrs to disk.
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
textwrap = "0.16.2"
time = "0.3.47"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "process",
    "signal",
    "fs",
    "sync",
    "time",
] }
tower = { version = "0.5.3", features = ["timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
unicode-width = "0.2.2"
unix_mode = "0.1.4"
zstd = "0.13.3"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
